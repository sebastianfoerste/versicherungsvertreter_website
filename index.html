        "mainEntity": [
          {
            "@type": "Question",
            "name": "Was kostet die erste Einschätzung?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Das Erstgespräch zur Einordnung Ihres Falls ist unverbindlich und kostenfrei. Eine Vergütung entsteht erst, wenn wir gemeinsam entscheiden, den Anspruch zu verfolgen. Die Grundlage der Vergütung halten wir vorher schriftlich fest."
            }
          },
          {
            "@type": "Question",
            "name": "Ich habe eine Aufhebungsvereinbarung unterschrieben. Ist damit alles erledigt?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nicht zwingend. Nach § 89b Abs. 4 Satz 1 HGB kann der Ausgleichsanspruch im Voraus nicht ausgeschlossen werden. Entscheidend sind Wortlaut und Zeitpunkt der Vereinbarung sowie die Frage, ob eine angemessene Gegenleistung vereinbart wurde."
            }
          },
          {
            "@type": "Question",
            "name": "In meinem Vertrag steht „nebenberuflich“. Verliere ich den Anspruch?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "§ 92b HGB knüpft an die tatsächliche Ausgestaltung der Tätigkeit an, nicht an die Bezeichnung im Vertrag. Wer den überwiegenden Teil seiner Arbeitszeit für die Agentur aufwendet und daraus den wesentlichen Teil seines Einkommens erzielt, wird regelmäßig als hauptberuflich behandelt."
            }
          },
          {
            "@type": "Question",
            "name": "Wozu brauche ich einen Buchauszug?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Der Buchauszug nach § 87c Abs. 2 HGB ist die Datengrundlage für die Berechnung. Ohne die darin enthaltenen Angaben zu vermittelten Verträgen, Provisionen und Stornierungen bleibt jede Bezifferung eine Schätzung."
            }
          },
          {
            "@type": "Question",
            "name": "Wie lange habe ich Zeit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Der Anspruch ist innerhalb eines Jahres nach Beendigung des Vertragsverhältnisses gegenüber dem Versicherer geltend zu machen (§ 89b Abs. 4 Satz 2 HGB). Es handelt sich um eine Ausschlussfrist."
            }
          }
        ]
