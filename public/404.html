<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden (404) | gunnercooke</title>
  <style>
    body {
      font-family: 'Lato', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #212529;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 520px;
      padding: 2rem;
      background: #ffffff;
      border: 1px solid #dfdfdf;
    }
    h1 {
      color: #aa1d47;
      font-size: 2.2rem;
      margin-bottom: 1rem;
      font-weight: 300;
    }
    p {
      color: #5c636b;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      background-color: #aa1d47;
      color: #ffffff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: background-color 0.2s;
    }
    a:hover {
      background-color: #8e1538;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404 – Seite nicht gefunden</h1>
    <p>Die angeforderte Seite existiert nicht oder wurde verschoben.</p>
    <a href="/">Zur Startseite</a>
  </div>
</body>
</html>
